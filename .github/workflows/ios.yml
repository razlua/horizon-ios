# Unofficial iOS build of the game: an unsigned .ipa to sideload (docs/ios.md).
# It holds no Minecraft file; the player adds their own prepared resources afterwards.
name: iOS

on:
  push:
    branches: [ios-port, on-device-setup]
    # Text alone changes no build.
    paths-ignore: ["**.md", "docs/**", "LICENSE", "altstore-source.json", "tools/ios/release-notes.py", "tools/ios/altstore-version.py"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

jobs:
  build:
    # Apple Silicon. The Intel machines (macos-15-intel) stopped taking jobs ("not acquired by
    # Runner of type hosted") on 2026-11-12; the Apple Silicon ones had sat queued on 2026-11-10.
    # The iOS SDK cross-compiles to arm64 phones from either, so switch back if one stalls.
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Rust with the iOS target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
      # Simple Voice Chat's codec, linked into the app (crates/voicechat-engine/build.rs):
      # Opus 1.5.2 from xiph.org, checked against its published SHA-256.
      - name: Opus for iOS
        run: |
          set -euo pipefail
          # Retried, then the same release from xiph's GitHub: the checksum decides either way.
          curl -sSL --retry 5 --retry-all-errors -o opus.tar.gz https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz             || curl -sSL --retry 5 --retry-all-errors -o opus.tar.gz https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz
          echo "65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1  opus.tar.gz" | shasum -a 256 -c -
          tar xzf opus.tar.gz
          cmake -S opus-1.5.2 -B "$RUNNER_TEMP/opus"             -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64             -DCMAKE_OSX_DEPLOYMENT_TARGET="$IPHONEOS_DEPLOYMENT_TARGET" -DCMAKE_BUILD_TYPE=Release             -DBUILD_SHARED_LIBS=OFF -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF
          cmake --build "$RUNNER_TEMP/opus" --config Release -j 4
          lib="$(find "$RUNNER_TEMP/opus" -name libopus.a | head -1)"
          lipo -info "$lib"
          echo "HORIZON_OPUS_DIR=$(dirname "$lib")" >> "$GITHUB_ENV"
      # The native mods built into the app (tools/ios/native-mods.txt; they start off): applied
      # to this source with horizon-mixins at the launcher's own commit (MIXINS_REV), as the
      # launcher's native build does. This job has a read-only token and no secrets: the mods'
      # build scripts run here.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mixins
          key: horizon-mixins-e8cd0aa38cffef49cb2e088ef716baa107148c02-${{ runner.os }}
      - name: horizon-mixins
        run: |
          set -euo pipefail
          if [ ! -x "$RUNNER_TEMP/mixins/bin/horizon-mixins" ]; then
            cargo install --locked --git https://github.com/horizon-rust/horizon-mixins \
              --rev e8cd0aa38cffef49cb2e088ef716baa107148c02 --root "$RUNNER_TEMP/mixins" horizon-mixins-cli
          fi
          "$RUNNER_TEMP/mixins/bin/horizon-mixins" --version
      - name: Native mods
        run: |
          set -euo pipefail
          python3 tools/ios/native-mods.py fetch "$RUNNER_TEMP/mods"
          python3 tools/ios/native-mods.py apply "$RUNNER_TEMP/mods" "$RUNNER_TEMP/mixins/bin/horizon-mixins" "$RUNNER_TEMP/stage"
          python3 tools/ios/native-mods.py notices "$RUNNER_TEMP/mods"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-mods
      # The staged (modded) source builds into this checkout's target/, which the cache keeps.
      - name: Build
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: >
          cd "$RUNNER_TEMP/stage" &&
          cargo build --profile fast --target aarch64-apple-ios
          -p horizon-client --bin horizon-client
          --no-default-features --features audio,system-allocator
      - name: Package
        env:
          HORIZON_IOS_BUILD: ${{ github.run_number }}
        run: |
          export HORIZON_IOS_VERSION="$(date -u +%Y.%-m.%-d)"
          bash packaging/ios/package.sh target/aarch64-apple-ios/fast/horizon-client dist/Horizon-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Horizon-ios-unsigned
          path: dist/Horizon-unsigned.ipa
          if-no-files-found: error
