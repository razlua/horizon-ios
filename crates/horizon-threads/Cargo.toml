[package]
name = "horizon-threads"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
description = "Scheduling hints for the game's threads and its allocator, and the other OS calls the crates that forbid unsafe code can't make"

[dependencies]
mimalloc = { version = "0.1.52", default-features = false }
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }

[target.'cfg(any(target_vendor = "apple", target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

# iOS: opening a web page in Safari (ios_url.rs); already in the tree through winit and cpal.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
# The keyboard's notifications take a block (ios_keyboard.rs); also already in the tree.
block2 = "0.6"

# Android: the same calls through JNI (android_sys.rs); both already in the tree through winit
# and cpal.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_IO", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_WindowsAndMessaging"] }

[features]
# Counts live heap bytes by startup step and thread (`CensusAllocator`); for measuring only.
alloc-census = []

[lints]
workspace = true
