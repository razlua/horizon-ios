[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The Android app's native library: android_main, which starts the game (unofficial port)"
publish = false

# libhorizon.so, which the activity loads (packaging/android/AndroidManifest.xml).
[lib]
name = "horizon"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = ["audio"]
audio = ["horizon-client/audio"]

[target.'cfg(target_os = "android")'.dependencies]
horizon-client = { path = "../horizon-client", default-features = false, features = ["system-allocator"] }
# The activity's glue (android-activity) comes through winit, at the version winit uses.
winit = { version = "0.30.13", features = ["android-native-activity"] }
